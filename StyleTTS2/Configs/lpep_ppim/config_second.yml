log_dir: "Models/lpep_ppim"
first_stage_path: "first_stage.pth"
save_freq: 50
log_interval: 1
device: "cuda"
epochs_1st: 200
epochs_2nd: 30
batch_size: 24
max_len: 300
pretrained_model: "epoch_2nd_00100.pth"
second_stage_load_pretrained: true
load_only_params: true

F0_path: "Utils/JDC/bst.t7"
ASR_config: "Utils/ASR/config.yml"
ASR_path: "Utils/ASR/epoch_00200.pth"
PLBERT_dir: 'Utils/PLBERT/'

data_params:
  train_data: "../create-dataset/id/final_dataset/phonemized_lists/train_list_phon.txt"
  val_data: "../create-dataset/id/final_dataset/phonemized_lists/val_list_phon.txt"
  root_path: "../create-dataset/id/final_dataset/wavs"
  OOD_data: "../create-dataset/id/final_dataset/phonemized_lists/test_list_phon.txt"
  min_length: 50
  dataset_config:
    default_lang_id: 0
    max_text_length: 510

preprocess_params:
  sr: 24000
  spect_params:
    n_fft: 2048
    win_length: 1200
    hop_length: 300

model_params:
  multispeaker: false
  dim_in: 64
  hidden_dim: 512
  max_conv_dim: 512
  n_layer: 3
  n_mels: 80
  n_token: 181
  max_dur: 50
  style_dim: 128
  dropout: 0.2
  use_ppim: true
  ppim_heads: 4
  use_lpep: true
  use_phoible_features: true
  n_langs: 2
  phon_feat_dim: 37
  lang_emb_dim: 16
  lpep_dropout: 0.1
  phoible_feature_table_path: "Data/phoible/lpep_phoible_table_id_jv.pt"

  decoder:
      type: 'istftnet'
      resblock_kernel_sizes: [3,7,11]
      upsample_rates: [10, 6]
      upsample_initial_channel: 512
      resblock_dilation_sizes: [[1,3,5], [1,3,5], [1,3,5]]
      upsample_kernel_sizes: [20, 12]
      gen_istft_n_fft: 20
      gen_istft_hop_size: 5

  slm:
      model: 'microsoft/wavlm-base-plus'
      sr: 16000
      hidden: 768
      nlayers: 13
      initial_channel: 64

  diffusion:
    embedding_mask_proba: 0.1
    transformer:
      num_layers: 3
      num_heads: 8
      head_features: 64
      multiplier: 2
    dist:
      sigma_data: 0.2
      estimate_sigma_data: true
      mean: -3.0
      std: 1.0

loss_params:
    lambda_mel: 5.
    lambda_gen: 1.
    lambda_slm: 1.
    lambda_mono: 1.
    lambda_s2s: 1.
    TMA_epoch: 15
    lambda_F0: 1.
    lambda_norm: 1.
    lambda_dur: 1.
    lambda_ce: 20.
    lambda_sty: 1.
    lambda_diff: 1.
    diff_epoch: 5
    joint_epoch: 10

optimizer_params:
  lr: 0.00005
  bert_lr: 0.00001
  ft_lr: 0.00001

slmadv_params:
  min_len: 400
  max_len: 500
  batch_percentage: 0.5
  iter: 10
  thresh: 5
  scale: 0.01
  sig: 1.5

use_data_parallel: false
diagnose_non_finite: true
fail_fast_on_non_finite: true
