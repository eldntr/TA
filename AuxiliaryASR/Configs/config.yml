log_dir: "Checkpoint"
save_freq: 10
device: "cuda"
epochs: 200
batch_size: 8
pretrained_model: "Checkpoint/epoch_00050.pth"
load_only_params: false
resume_epoch: 51
train_data: "../dataset_sidon/train_list.txt"
val_data: "../dataset_sidon/val_list.txt"

dataset_params:
  sr: 16000
  data_root: "../dataset_sidon/wavs"

model_params:
   input_dim: 80
   hidden_dim: 256
   n_token: 181
   token_embedding_dim: 256

optimizer_params:
  lr: 0.0005
